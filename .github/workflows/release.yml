name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: publish
        run: dotnet publish TC1.Studio/TC1.Studio.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: zip
        run: Compress-Archive -Path publish/TC1.Studio.exe -DestinationPath TC1.Studio-win-x64.zip

      - name: upload
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TC1.Studio-win-x64.zip
            publish/TC1.Studio.exe
